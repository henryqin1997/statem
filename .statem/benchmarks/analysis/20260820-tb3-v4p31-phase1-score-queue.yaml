    - failed_validation_delta_receipt_is_atomically_invalidated
  v4p38_risk_result: >-
    Reward-valid raw one with a complete no-resume handoff through revise,
    second falsification, quarantine, and final replay. Protocol-invalid because
    ATIF recorded Codex 0.149.0 while the matched direct baseline and admission
    contract require 0.148.0. The complete job is checksum-verified locally.
  v4p39_control:
    - adapter_boundary_requires_codex_0_148_0
    - conflicting_caller_version_is_rejected
    - v4p38_runbook_and_semantic_controls_are_unchanged
  v4p39_risk_result: >-
    Protocol-valid raw one with Codex 0.148.0, no host resume, and a complete
    handoff through revise, second falsification, quarantine, and final replay.
    One mechanical replay-receipt shape error was repaired in the same context
    before the transition succeeded. The checksum-verified sentinel admits one
    fresh matched data-anonymization k1 StateM cell but is not score eligible.
  v4p39_data_result: >-
    The fresh data-anonymization cell produced a candidate, an eight-obligation
    preflight, four passing adapter-owned replay checks, and one independent
    review. With 681 seconds remaining against a 1,500-second revision reserve,
    the review router correctly quarantined the candidate. The downstream gate
    rejected that deadline-authorized route five times because one review slot
    remained, so the standard-timeout cell ended protocol-invalid in quarantine
  v4p40_risk_result: >-
    The repeated negative-transfer sentinel reached a second solve cycle with a
    candidate, candidate-bound public evidence, adapter replay, and complete
    preflight review. The solve-to-falsify gate then rejected the candidate-blind
    plan because it did not append the exact prior validation delta. Four host
    resumes produced no progress, so the cell ended protocol-invalid in solve
    without verifier reward. This is the same failure-closure class previously
    observed in v4p37 and supplies no new generic progress; v4p40 is not promoted.
    without verifier reward. The complete 849 MB job is checksum verified.
  v4p40_control:
    - deadline_quarantine_requires_bound_review_route
    - remaining_seconds_must_be_less_than_complete_revision_reserve
    - candidate_disposition_and_evaluation_target_must_match
    - all_other_early_route_changes_remain_blocked
    - v4p39_runbook_codex_version_and_semantic_receipts_are_unchanged
  exact_branch_replay: passed_with_original_data_receipts_and_candidate_snapshot
  next_gate: protocol_valid_raw_one_v4p40_risk_sentinel

