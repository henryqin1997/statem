version: 1
objective:
  metric: terminal_bench_3_raw_percentage_points
  target_delta: 15
  count_only:
    - standard_timeout
    - no_retry
    - fresh_for_tested_control
  exclude:
    - adapted_development
    - diagnostic_replay
    - extended_timeout
    - repeated_sentinel
  causal_requirement:
    - same_model
    - same_codex_version
    - same_platform_class
    - same_timeout
    - same_retry_policy
    - matched_direct_baseline

triage_policy:
  priority_factors:
    - framework_control_fit
    - hardware_feasibility
    - expected_api_and_wall_cost
    - observable_development_progress
  deprioritize:
    - likely_model_capability_ceiling
    - unavailable_or_expensive_hardware
    - ambiguous_public_acceptance_surface
    - repeated_development_without_validation_delta
  development_progress_requires_any:
    - new_reproducible_discriminator
    - narrower_failure_owner
    - candidate_blind_plan_delta_bound_before_retry
    - public_check_or_artifact_improvement
    - independently_replayable_stage_milestone
  admission_gate:
    require_before_launch:
      - dominant_difficulty_hypothesis
      - statem_controllability_hypothesis
      - capability_ceiling_risk
      - hardware_resource_risk
      - cheapest_public_discriminator
      - expected_api_cost
      - expected_wall_time
      - observable_progress_target
      - stop_or_park_condition
    reject_when:
      - no_public_discriminator_for_proposed_control
      - hardware_requirement_unavailable
      - capability_ceiling_dominates_without_new_generic_hypothesis
      - two_consecutive_attempts_without_substantive_progress
    preference: >-
      Maximize expected raw-score gain per API dollar and lane-hour, subject to
      high StateM control ownership and a machine-auditable progress signal.
  bottleneck_preflight:
    required_fields:
      - dominant_limit_prior
      - evidence_basis
      - cheapest_public_discriminator
      - expected_api_and_wall_cost
      - hardware_feasibility
      - owning_control_layer
    dominant_limit_classes:
      - statem_controllable_workflow
      - base_model_capability
      - hardware_or_resource
      - mixed
      - unresolved
  allocation_rule: >-
    Prefer statem-controllable or mixed cells with a cheap public discriminator;
    defer capability and hardware ceilings unless a new generic hypothesis or
    feasible resource change makes the next observation informative.
  ranking_order:
    - hardware_and_platform_feasible
    - statem_control_ownership_likelihood
    - cheapest_public_discriminator
    - expected_raw_gain
    - expected_api_cost
    - expected_wall_time
  note: >-
    Lowest API price alone does not lead the queue when the dominant uncertainty
    is base-model capability or the wall-time reserve is much larger.
  no_progress_limit: 2
  no_progress_action: park_and_advance_queue
  no_progress_definition: >-
    No new reproducible discriminator, narrower owner, candidate-blind validation
    delta, public artifact improvement, or independently replayable milestone.
  iteration_rule: >-
    Continue only when the last cell changed the posterior over failure ownership
    or advanced a machine-auditable artifact; otherwise spend the next lane on the
    next ranked task.
  develop_success_definition: >-
    A develop cell succeeds only if it advances a public artifact, closes a
    validation obligation, narrows failure ownership, or creates a replayable
    stage milestone. More tokens, another trajectory, or a differently worded
    diagnosis is not progress.
  sampling:
    triage: matched_k1_direct_and_statem
    estimate: matched_k5_after_control_promotion
    note: adapted samples never become final holdouts
  admission_enforcement:
    layer: benchmark_orchestration
    status: implemented_pending_launch_integration_validation
    mechanism: content_addressed_prelaunch_receipt
    implementation: integrations/harbor/experimental/tb3_admission_gate.py
    excluded_layers:
      - statem_core
      - task_agent_context
    receipt_must_bind:
      - queue_sha256
      - job_name
      - task
      - control_version
      - experiment_mode
      - platform_class
      - dominant_limit_prior
      - evidence_basis
      - owning_control_layer
      - hardware_feasibility
      - cheapest_public_discriminator
      - expected_api_cost
      - expected_wall_time
      - observable_progress_target
      - stop_or_park_condition
      - hypothesis_scoped_no_progress_count
      - admission_decision
      - decision_reasons
    decisions:
      - admit
      - defer
      - reject
    note: >-
      The validator checks completeness, consistency, and explicit resource and
      no-progress policy. It does not convert a semantic bottleneck prior into
      ground truth or expose the receipt to the task agent.

families:
  stateful-lifecycle:
    development:
      - task: mvcc-lsm-compaction
        public_sol_passes: 0
