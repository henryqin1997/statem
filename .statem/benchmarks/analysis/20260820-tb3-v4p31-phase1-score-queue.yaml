version: 1
objective:
  metric: terminal_bench_3_raw_percentage_points
  target_delta: 15
  count_only:
    - standard_timeout
    - no_retry
    - fresh_for_tested_control
  exclude:
    - adapted_development
    - diagnostic_replay
    - extended_timeout
    - repeated_sentinel
  causal_requirement:
    - same_model
    - same_codex_version
    - same_platform_class
    - same_timeout
    - same_retry_policy
    - matched_direct_baseline

triage_policy:
  priority_factors:
    - framework_control_fit
    - hardware_feasibility
    - expected_api_and_wall_cost
    - observable_development_progress
  deprioritize:
    - likely_model_capability_ceiling
    - unavailable_or_expensive_hardware
    - ambiguous_public_acceptance_surface
    - repeated_development_without_validation_delta
  development_progress_requires_any:
    - new_reproducible_discriminator
    - narrower_failure_owner
    - candidate_blind_plan_delta_bound_before_retry
    - public_check_or_artifact_improvement
  no_progress_limit: 2
  no_progress_action: park_and_advance_queue
  sampling:
    triage: matched_k1_direct_and_statem
    estimate: matched_k5_after_control_promotion
    note: adapted samples never become final holdouts

families:
  stateful-lifecycle:
    development:
      - task: mvcc-lsm-compaction
        public_sol_passes: 0
        public_sol_attempts: 5
        state: v4p32_final_adapted_attempt_active
        development_attempts_for_current_hypothesis: 2
        development_progress: generic_lifecycle_gap_identified
        park_unless: same_state_progress_witness_enables_additional_public_artifact_or_milestone_progress
      - task: session-window-debug
        public_sol_passes: 0
        public_sol_attempts: 5
        state: parked_after_two_attempts
        development_attempts_for_current_hypothesis: 2
        development_progress: generic_required_strata_coverage_gap_identified
        final_attempt_result: no_candidate_or_preflight_and_no_new_progress_signal
        dominant_limit: unresolved_task_execution_or_orchestration_burden_before_candidate
        reopen_only_with: new_generic_hypothesis_from_another_task
  structured-transformation:
    development:
      - task: html-js-filter
        public_sol_passes: 1
        public_sol_attempts: 5
        state: adapted_v4p31_protocol_invalid_after_second_cycle_open
        development_progress: implementation_owner_and_append_only_validation_delta_identified
        next_eligible_control: v4p32_or_newer
        score_eligible: false
      - task: interleaved-vigenere
        public_sol_passes: 1
        public_sol_attempts: 5
        state: sentinel
  algorithm-performance:
    development:
      - task: vf2-speedup-networkx
        public_sol_passes: 1
        public_sol_attempts: 5
        state: expensive_sentinel
  numerical-model:
    development:
      - task: lake-temp-glm
        public_sol_passes: 1
        public_sol_attempts: 5
        state: attribution_needed
  simulation-artifact:
    development:
      - task: cad-model
        public_sol_passes: 1
        public_sol_attempts: 5
        state: deferred_ambiguous_projection

initial_lanes:
  local:
    task: html-js-filter
    mode: completed_extended_diagnostic
    control_version: v4p31
    backup_tree_sha256: d661ad65b60f983b771c9c299d5a2ad33899b0c956eae86b1c15299acc7c37b6
  remote_a:
    task: mvcc-lsm-compaction
    mode: final_adapted_development
    control_version: v4p32
  remote_b:
