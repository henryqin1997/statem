  v4p37_risk_result: >-
    Canonical preflight evidence reached candidate construction, two independent
    falsifier reviews, quarantine, final replay, and one information-gain and
    deadline-authorized recovery cycle. The final candidate was blocked because
    its candidate-blind plan did not append the exact prior validation delta.
