version: 1
role: falsifier

stages:
  - id: bind_scope
    objective: Bind the exact candidate, baseline, contract seal, and context view before making claims.
  - id: partition_contract
    objective: Separate hard task-visible contract from defeasible implementation evidence.
  - id: adjudicate_semantics
    objective: Enumerate plausible semantic forks and run or derive checks that distinguish them.
  - id: replay_differential
    objective: Attribute regressions through paired baseline and candidate evidence.
  - id: adjudicate_protections
    objective: Corroborate, falsify, or leave unresolved every proposed protection claim.
  - id: issue_verdict
    objective: Return the narrowest evidence-supported authorization recommendation.

practices:
  - id: contract_authority_and_repair
    allow_not_applicable: false
    trigger: Always.
    procedure: Classify assertions rather than files. Treat explicit task requirements, public signatures and consumers, normative definitions, and cross-module invariants as possible hard authority; treat comments, docstrings, starter behavior, and stale operational notes in an explicitly broken target as defeasible until independently corroborated. Resolve code-document conflicts with discriminating public probes and preserve the correct public abstraction rather than literal defective text. Distinguish paired candidate-caused regressions from direct hard-contract violations that may also exist in a broken or absent baseline.
    required_evidence: For every blocking contract claim, record its allowed authority basis and evidence; list conflicting defeasible claims separately with the probe or repair implication that resolves them. Put every supported direct candidate contract failure in contract_violations rather than leaving it only in summary or counterevidence.
    solver_projection:
      invariant: Task-visible requirements, public signatures and consumers, normative definitions, and cross-module invariants outrank uncorroborated behavior in an explicitly broken implementation.
      required_action: Classify claims at assertion granularity, resolve code-document conflicts with a discriminating public probe, and repair toward the supported public abstraction.
      self_check: For each changed behavior, record its authority basis, the competing defeasible claim, and the public evidence that selects the repair.

  - id: profile_selection_adequacy
    allow_not_applicable: false
    trigger: Always.
    procedure: Independently check that the pre-candidate primary and secondary profiles cover the salient task-visible risk classes. Do not silently add or replace a profile during review.
    required_evidence: Identify the covered risk classes and any material routing gap; an inadequate selection is unresolved evidence for revision, not an expanded hard contract.

  - id: source_is_not_contract
    allow_not_applicable: false
    trigger: Always.
    procedure: Treat comments and behavioral docs in broken targets as hypotheses until corroborated by task-visible evidence.
    required_evidence: Identify the basis used for every protected behavior.
    solver_projection:
      invariant: A comment, docstring, starter implementation, or stale operational note is not a hard contract without independent task-visible corroboration.
      required_action: Treat implementation-local behavioral claims as hypotheses and test them against task wording, public consumers, normative definitions, or cross-module invariants.
      self_check: Bind every protected behavior to an allowed authority basis and leave unsupported source-only behavior unprotected.

  - id: named_variant_discrimination
    allow_not_applicable: true
    trigger: A candidate or protection selects one of several named algorithm, estimator, protocol, or convention variants.
    procedure: Enumerate at least two plausible variants and exercise a case on which their observable results differ.
    required_evidence: Record the alternatives, discriminating case, and observed result; do not rely on the selected implementation's own documentation.

  - id: finite_categorical_domain_coverage
    allow_not_applicable: true
    trigger: A public oracle, scorer, parser, protocol, or model accepts a finite or compactly enumerable categorical input whose production domain is not exhausted by the visible sample.
    procedure: Derive the candidate-blind category domain from an explicit schema, normative code space, bounded alphabet or format, or another task-visible public basis. Exercise the full domain when feasible, or record a deterministic partition and every uncovered region. Retain exceptional categories and establish fallback equivalence separately from observed examples. Include missing, unknown, case, and normalization variants only when the public surface admits them.
    required_evidence: Record the selection basis, enumerated or partitioned domain, exceptional categories, fallback class, required variants, and uncovered regions. Random category sampling and the categories in one visible packet are insufficient.

  - id: objective_order_authority
    allow_not_applicable: true
    trigger: The visible contract names multiple objectives, priorities, scores, tie-breaks, safety constraints, or optimization components without uniquely fixing their ordering or aggregation.
    procedure: Enumerate the plausible lexicographic, constrained, or multi-objective interpretations before candidate work. Bind a fixed public population containing at least one case on which the alternatives select different observable outputs. A supplied population on which all plausible interpretations collapse to the same output is useful coverage but does not establish objective authority. Keep the fork unresolved unless task wording, a public consumer, a normative definition, or a genuinely discriminating public case selects one interpretation.
    required_evidence: Record each plausible ordering, its authority basis, the fixed public population identity, the distinguishing case and outcomes, or an explicit unresolved assessment when no authorized discriminator exists.

  - id: candidate_blind_obligation_closure
    allow_not_applicable: false
    trigger: Always.
    procedure: Assess every immutable candidate-blind acceptance requirement exactly once using evidence compatible with its declared mode. Adapter replay requires the bound adapter receipt, paired review requires independent baseline/candidate artifact evidence, and analytic review requires an independent derivation from the bounded public sources. Solver-recorded values, candidate prose, or an unrelated passing output check cannot close a semantic obligation.
    required_evidence: Return one requirement-id-bound assessment per acceptance obligation. Mark absent, mode-incompatible, non-discriminating, or insufficiently independent evidence unresolved so promotion routes to revision or deadline-aware quarantine.
    solver_projection:
      invariant: Every candidate-blind acceptance requirement remains immutable after candidate work begins and can be closed only by evidence compatible with its declared mode.
      required_action: Preserve every requirement id and stratum, provide executable adapter-replay checks where required, and never substitute solver prose for independent evidence.
      self_check: Confirm exact requirement and stratum coverage, candidate identity binding, and explicit residual risk for every obligation before review.

  - id: no_unjustified_range_or_clamp
    allow_not_applicable: true
    trigger: The candidate clips, clamps, saturates, normalizes, rounds, or otherwise restricts an output range.
    procedure: Verify that the task-visible or normative contract guarantees that range; otherwise challenge the transformation with a boundary case.
    required_evidence: Cite the range basis or provide a counterexample.

  - id: paired_regression_causality
    allow_not_applicable: false
    trigger: Always.
    procedure: Call an issue a regression only after comparing the same public check on baseline and candidate.
    required_evidence: Record both baseline and candidate observations for every blocking regression.

  - id: named_reference_adjudication
    allow_not_applicable: true
    trigger: The task names an exact public oracle, version, normative implementation, or consumer behavior.
    procedure: Compare baseline and candidate to the named reference on the same discriminating case. Treat the reference as the contract anchor and the baseline as defeasible evidence.
    required_evidence: Record reference, baseline, and candidate observations; do not call movement toward the named reference a regression.

  - id: public_consumer_first
    allow_not_applicable: false
    trigger: Always.
    procedure: Prefer the strongest bounded public consumer path over internal proxies or implementation-local assertions.
    required_evidence: Name the public surface or explain why only a derived check is available.
    solver_projection:
      invariant: The candidate must work through the strongest task-visible public consumer path, not only an implementation-local proxy.
      required_action: Identify and exercise the public entry point, wrapper, format, lifecycle, or consumer that actually observes the repaired behavior.
      self_check: Name the public surface and record a bounded end-to-end observation, or explain the residual gap when only a derived check is available.

  - id: quantitative_acceptance_gap
    allow_not_applicable: true
    trigger: The task has an explicit numerical performance, accuracy, cost, latency, memory, or resource threshold.
    procedure: Keep adaptive exploration and untouched acceptance populations distinct. Emit an actionable quantitative_acceptance hard_contract_gap only when authorized evidence actually evaluated a fixed observed_public population and did not conservatively clear the hard threshold with a variance-aware margin. Mark an inaccessible benchmark population sealed_unavailable; preserve it as residual acceptance uncertainty without treating absence of hidden labels as a candidate defect or a reason for another recovery cycle.
    required_evidence: Record the contract basis, evidence role, population access, fixed population id, observed aggregate or failure, required independent evidence, and next bounded optimization action. Generic reviewer uncertainty is not a hard gap, and provider allocation must not be invented before an exact receipt exists.

  - id: uncertainty_routes_to_revision
    allow_not_applicable: false
    trigger: Always.
    procedure: Keep unsupported or candidate-only concerns advisory and route unresolved semantic questions to revision rather than destructive rollback.
    required_evidence: Separate blocking evidence from residual counterevidence.

  - id: protection_claim_completeness
    allow_not_applicable: false
    trigger: Always.
    procedure: Adjudicate every proposed protected behavior independently; proposal inclusion does not make a claim true or immutable.
    required_evidence: Return exactly one protection assessment per proposed behavior.
